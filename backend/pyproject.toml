[project]
name = "argos-control-tower-backend"
version = "0.1.0"
description = "Trusted manufacturing state projection and read API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "polars>=1.32",
    "pydantic>=2.11",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "duckdb>=1.3",
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
